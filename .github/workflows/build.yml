name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      # 1. 빌드에 필요한 누락된 .env.example 빈 파일 생성
      - name: Create missing env file
        run: touch .env.example

      # 2. current_key까지 완벽하게 채워 넣은 가짜 google-services.json 생성 (플러그인 완벽 우회)
      - name: Create fake google-services.json
        run: |
          mkdir -p app/
          echo '{"project_info":{"project_number":"123456789","project_id":"fake-project"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:123456789","android_client_info":{"package_name":"com.aistudio.applock.nxpattern"}},"api_key":[{"current_key":"AIzaSyFakeKey_1234567890abcdefghijklm"}]}]}' > app/google-services.json

      # 3. 임시 디버그 인증서(keystore) 강제 생성
      - name: Generate missing debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. 테스트 과정을 제외하고 100% 깔끔하게 순수 APK만 컴파일 수행
      - name: Build Debug APK
        run: gradle assembleDebug -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
